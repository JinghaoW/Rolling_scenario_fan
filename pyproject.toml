[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-fan"
version = "0.1.0"
description = "Rolling-horizon hydro-thermal scheduling with a scenario fan"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "pyomo>=6.4",
    "h5py>=3.0",
    "openpyxl>=3.0",
]

[project.scripts]
fansi = "c.run:main"

[tool.setuptools.packages.find]
include = ["c*", "b_read_dataset*"]
